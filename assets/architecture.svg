<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Three trigger layers converge on one idempotent claim-then-deliver path">
  <style>
    .box { fill: #f6f7f9; stroke: #c9ced8; stroke-width: 1.2; rx: 10; }
    .core { fill: #eaf1fe; stroke: #6ea8fe; stroke-width: 1.6; rx: 10; }
    .out { fill: #eafaf0; stroke: #5ec98a; stroke-width: 1.6; rx: 10; }
    .t { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #1d2026; }
    .h { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #1d2026; }
    .s { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #616a79; }
    .l { stroke: #8a93a3; stroke-width: 1.2; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e2128; stroke: #3a4150; }
      .core { fill: #1b2740; stroke: #6ea8fe; }
      .out { fill: #16281f; stroke: #5ec98a; }
      .t, .h { fill: #e8eaf0; }
      .s { fill: #9aa3b2; }
      .l { stroke: #6b7484; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3"/>
    </marker>
  </defs>
  <rect class="box" x="16" y="16" width="196" height="52"/>
  <text class="h" x="32" y="40">In-process timer</text>
  <text class="s" x="32" y="57">one setTimeout, re-armed</text>
  <rect class="box" x="16" y="92" width="196" height="52"/>
  <text class="h" x="32" y="116">Windows Task Scheduler</text>
  <text class="s" x="32" y="133">StartWhenAvailable catch-up</text>
  <rect class="box" x="16" y="168" width="196" height="52"/>
  <text class="h" x="32" y="192">Replay at host start</text>
  <text class="s" x="32" y="209">covers a host that was down</text>
  <path class="l" d="M 212 42 C 262 42 268 118 300 122"/>
  <path class="l" d="M 212 118 L 300 124"/>
  <path class="l" d="M 212 194 C 262 194 268 132 300 128"/>
  <rect class="core" x="304" y="92" width="164" height="64"/>
  <text class="h" x="322" y="118">claim, then deliver</text>
  <text class="s" x="322" y="136">flips to fired first, so a</text>
  <text class="s" x="322" y="150">second layer finds nothing</text>
  <rect class="out" x="500" y="92" width="204" height="64"/>
  <text class="h" x="518" y="118">wake the conversation</text>
  <text class="s" x="518" y="136">keyword + scheduled time</text>
  <text class="s" x="518" y="150">+ drift + overdue warning</text>
  <path class="l" d="M 468 124 L 498 124"/>
</svg>
